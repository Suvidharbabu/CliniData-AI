<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | CliniData AI</title>
  <meta name="description" content="Request a walkthrough of CliniData AI.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <script type="module" src="/src/js/main.js"></script>
  <script type="module" src="/src/js/contact.js"></script>
</head>
<body>
<main>
  <section class="page-hero">
    <div class="container">
      <span class="eyebrow">Contact</span>
      <h1>Request a walkthrough</h1>
      <p class="lead">Tell us which frameworks you work under and what you want to test. We'll follow up by email.</p>
    </div>
  </section>
  <section class="section">
    <div class="container" style="max-width:760px">
      <form class="card" id="contact-form" novalidate>
        <div class="form-grid">
          <div class="field"><label for="name">Name</label><input id="name" name="name" required maxlength="120" autocomplete="name"></div>
          <div class="field"><label for="email">Work email</label><input id="email" name="email" type="email" required autocomplete="email"></div>
          <div class="field"><label for="organization">Organisation</label><input id="organization" name="organization" maxlength="160" autocomplete="organization"></div>
          <div class="field"><label for="role">Role</label>
            <select id="role" name="role">
              <option value="">Select…</option><option>Chief Compliance Officer</option><option>Privacy Officer / DPO</option>
              <option>Quality Assurance / GxP</option><option>Pharmacovigilance</option><option>Information Security</option>
              <option>Clinical Operations</option><option>Other</option>
            </select></div>
          <div class="field full"><label for="message">What would you like to see?</label>
            <textarea id="message" name="message" maxlength="4000" placeholder="e.g. HIPAA and GDPR gap review for a multi-site oncology trial"></textarea></div>
          <div class="hp-field" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
        </div>
        <div id="contact-alert" class="alert" hidden style="margin-top:16px"></div>
        <div class="btn-row" style="margin-top:18px">
          <button class="btn btn-primary" type="submit" id="contact-submit">Send request</button>
          <span class="muted small" style="align-self:center">Don't include patient data or other confidential information.</span>
        </div>
      </form>
    </div>
  </section>
</main>
</body>
</html>
